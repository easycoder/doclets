  <script>function print(msg) { console.log(msg); }</script>
  <style>
    @media print {
      @page { margin: 10mm; }
      body > *:not(#print-content) { display: none !important; }
      #print-content {
        display: block !important;
        position: static !important;
        width: 100% !important;
        height: auto !important;
        overflow: visible !important;
        margin: 0 !important;
        padding: 0 !important;
        font-size: 14pt !important;
        text-align: left !important;
      }
    }
  </style>
  <script>
    window.addEventListener('beforeprint', function() {
      var content = document.getElementById('DocletViewContent');
      if (!content) return;
      var div = document.createElement('div');
      div.id = 'print-content';
      div.innerHTML = content.innerHTML;
      document.body.appendChild(div);
    });
    window.addEventListener('afterprint', function() {
      var div = document.getElementById('print-content');
      if (div) div.remove();
    });
  </script>
  <!-- Uncomment the the next line for deployment -->
  <script type='text/javascript' src='https://allspeak.ai/dist/allspeak-min.js'></script>
  <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/mqtt/dist/mqtt.min.js"></script>
  <script>
    // Register the service worker that makes the app installable and caches
    // the shell (see sw.js). Deferred to `load` so it never competes with
    // the AllSpeak runtime for the first paint.
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('sw.js').catch(function (err) {
          console.warn('Service worker registration failed:', err);
        });
      });
    }
  </script>
